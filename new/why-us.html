<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Evelynx Solutions — IT & Technology Nepal</title>
    <meta name="description" content="Nepal's premier IT company delivering software, cloud, cybersecurity, and digital transformation from Kathmandu."/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        /* ──────────── GLOBAL TOKENS & RESET ──────────── */
        :root {
            --ink:     #0D0F14;
            --ink-2:   #1C2030;
            --blue:    #0B3D91;
            --blue-2:  #1554C0;
            --gold:    #B8922A;
            --gold-lt: #D4AD5A;
            --muted:   #6B7280;
            --border:  #E4E7EC;
            --off:     #F8F9FB;
            --white:   #FFFFFF;
            --red:     #C8102E;
            --f-display: 'Cormorant Garamond', Georgia, serif;
            --f-body:    'Outfit', system-ui, sans-serif;
            --ease: cubic-bezier(.16,1,.3,1);
            --dur: .65s;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: var(--f-body);
            background: var(--white);
            color: var(--ink);
            line-height: 1.65;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        img { display: block; max-width: 100%; }
        a { color: inherit; text-decoration: none; }
        button { font-family: var(--f-body); cursor: pointer; border: none; background: none; }
        ul { list-style: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--off); }
        ::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 4px; }

        #prog { position: fixed; top: 0; left: 0; height: 2px; background: var(--gold); z-index: 9999; width: 0; transition: width .1s linear; }

        .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 900; display: flex; align-items: center; justify-content: space-between; padding: 0 4rem; height: 72px; transition: background .4s, box-shadow .4s; }
        .nav.bg { background: rgba(255,255,255,.96); backdrop-filter: blur(16px); box-shadow: 0 1px 0 var(--border); }
        .nav-logo { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; letter-spacing: -.01em; color: var(--ink); }
        .nav-logo-mark { width: 36px; height: 36px; background: var(--blue); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
        .nav-logo-mark svg { width: 20px; height: 20px; }
        .nav-links { display: flex; align-items: center; gap: 2.5rem; }
        .nav-links a { font-size: .875rem; font-weight: 400; color: var(--muted); letter-spacing: .03em; transition: color .2s; position: relative; padding-bottom: 2px; }
        .nav-links a::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 100%; height: 1px; background: var(--blue); transition: right .3s var(--ease); }
        .nav-links a:hover { color: var(--ink); }
        .nav-links a:hover::after { right: 0; }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .nav-cta { font-size: .875rem; font-weight: 500; letter-spacing: .04em; color: var(--white); background: var(--blue); padding: .55rem 1.5rem; border-radius: 4px; transition: background .2s, transform .2s; }
        .nav-cta:hover { background: var(--blue-2); transform: translateY(-1px); }
        .nav-lang { font-size: .85rem; color: var(--muted); padding: .3rem; transition: color .2s; }
        .nav-lang:hover { color: var(--ink); }
        .nav-ham { display: none; flex-direction: column; gap: 5px; padding: 4px; }
        .nav-ham span { width: 22px; height: 1.5px; background: var(--ink); border-radius: 2px; transition: all .3s; }

        .hero { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; padding-top: 72px; overflow: hidden; }
        .hero-left { display: flex; flex-direction: column; justify-content: center; padding: 7rem 4rem; position: relative; }
        .hero-left::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px; background: linear-gradient(to bottom, transparent, var(--border) 30%, var(--border) 70%, transparent); }
        .hero-eyebrow { display: flex; align-items: center; gap: .75rem; font-size: .75rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 2rem; }
        .hero-eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--gold); }
        .hero-h1 { font-family: var(--f-display); font-size: clamp(3.2rem, 5.5vw, 5rem); font-weight: 300; line-height: 1.08; letter-spacing: -.02em; color: var(--ink); margin-bottom: 1.75rem; }
        .hero-h1 em { font-style: italic; color: var(--blue); }
        .hero-h1 strong { font-weight: 600; }
        .hero-p { font-size: 1.05rem; font-weight: 300; color: var(--muted); max-width: 440px; line-height: 1.8; margin-bottom: 2.75rem; }
        .hero-actions { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .btn-dark { font-size: .9rem; font-weight: 500; letter-spacing: .04em; color: var(--white); background: var(--ink); padding: .85rem 2rem; border-radius: 3px; transition: background .2s, transform .2s; display: inline-flex; align-items: center; gap: .6rem; }
        .btn-dark:hover { background: var(--blue); transform: translateY(-2px); }
        .btn-text { font-size: .9rem; font-weight: 400; color: var(--muted); display: inline-flex; align-items: center; gap: .5rem; transition: color .2s; letter-spacing: .03em; }
        .btn-text:hover { color: var(--blue); }
        .btn-text .arr { transition: transform .3s; }
        .btn-text:hover .arr { transform: translateX(4px); }
        .hero-stats { margin-top: 5rem; padding-top: 2.5rem; border-top: 1px solid var(--border); display: flex; gap: 3rem; }
        .stat-n { font-family: var(--f-display); font-size: 2.6rem; font-weight: 300; color: var(--ink); line-height: 1; }
        .stat-n span { color: var(--gold); font-size: 2rem; }
        .stat-l { font-size: .78rem; font-weight: 400; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: .3rem; }
        .hero-right { position: relative; overflow: hidden; background: var(--ink); }
        .hero-right img { width: 100%; height: 100%; object-fit: cover; opacity: .65; transition: transform 8s ease; }
        .hero-right:hover img { transform: scale(1.04); }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(11,61,145,.5) 0%, rgba(13,15,20,.4) 100%); }
        .hero-card { position: absolute; bottom: 2.5rem; left: 2.5rem; right: 2.5rem; background: rgba(255,255,255,.07); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 1.5rem 1.75rem; display: flex; align-items: center; gap: 1.25rem; }
        .hero-card-icon { width: 44px; height: 44px; background: var(--gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .hero-card p { font-size: .85rem; color: rgba(255,255,255,.7); }
        .hero-card strong { display: block; color: #fff; font-size: 1rem; font-weight: 500; margin-bottom: .15rem; }

        .ticker-wrap { overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--off); padding: .9rem 0; }
        .ticker { display: flex; animation: ticker 30s linear infinite; white-space: nowrap; }
        .ticker-item { display: inline-flex; align-items: center; gap: .75rem; font-size: .78rem; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 2.5rem; }
        .ticker-item::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
        @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .sec { padding: 8rem 4rem; }
        .sec-alt { background: var(--off); }
        .sec-dark { background: var(--ink); color: var(--white); }
        .eyebrow { display: flex; align-items: center; gap: .6rem; font-size: .72rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.25rem; }
        .eyebrow::before { content: ''; width: 20px; height: 1px; background: var(--gold); }
        .sec-h { font-family: var(--f-display); font-size: clamp(2.2rem, 4vw, 3.6rem); font-weight: 300; line-height: 1.12; letter-spacing: -.02em; color: var(--ink); margin-bottom: 1.2rem; }
        .sec-h em { font-style: italic; color: var(--blue); }
        .sec-dark .sec-h { color: var(--white); }
        .sec-sub { font-size: 1.05rem; font-weight: 300; color: var(--muted); max-width: 540px; line-height: 1.8; }
        .sec-dark .sec-sub { color: rgba(255,255,255,.55); }

        .solutions-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4rem; gap: 2rem; flex-wrap: wrap; }
        .solutions-link { font-size: .85rem; font-weight: 500; color: var(--blue); display: inline-flex; align-items: center; gap: .5rem; letter-spacing: .04em; transition: gap .2s; }
        .solutions-link:hover { gap: .9rem; }
        .bento { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1.5px; background: var(--border); border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; }
        .bento-cell { background: var(--white); padding: 3rem 2.5rem; position: relative; overflow: hidden; transition: background .3s; cursor: default; }
        .bento-cell:hover { background: var(--off); }
        .bento-cell.dark { background: var(--ink); }
        .bento-cell.dark:hover { background: var(--ink-2); }
        .bento-cell.blue { background: var(--blue); }
        .bento-cell.blue:hover { background: var(--blue-2); }
        .b1 { grid-column: span 5; grid-row: span 2; }
        .b2 { grid-column: span 4; }
        .b3 { grid-column: span 3; }
        .b4 { grid-column: span 4; }
        .b5 { grid-column: span 3; }
        .b6 { grid-column: span 5; }
        .b7 { grid-column: span 4; grid-row: span 2; }
        .b8 { grid-column: span 3; }
        .b9 { grid-column: span 5; }
        .bento-num { font-family: var(--f-display); font-size: 4rem; font-weight: 300; color: rgba(0,0,0,.06); position: absolute; top: 1.5rem; right: 1.75rem; letter-spacing: -.04em; line-height: 1; }
        .dark .bento-num, .blue .bento-num { color: rgba(255,255,255,.08); }
        .bento-ico { font-size: 1.8rem; margin-bottom: 1.25rem; display: inline-block; }
        .bento-h { font-family: var(--f-display); font-size: 1.35rem; font-weight: 400; line-height: 1.2; margin-bottom: .65rem; letter-spacing: -.01em; }
        .dark .bento-h, .blue .bento-h { color: var(--white); }
        .bento-p { font-size: .88rem; color: var(--muted); line-height: 1.7; font-weight: 300; }
        .dark .bento-p { color: rgba(255,255,255,.5); }
        .blue .bento-p { color: rgba(255,255,255,.7); }
        .bento-tag { display: inline-block; margin-top: 1.25rem; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; color: var(--gold); padding: .3rem .75rem; border: 1px solid rgba(184,146,42,.25); border-radius: 100px; }
        .blue .bento-tag { color: rgba(255,255,255,.6); border-color: rgba(255,255,255,.2); }
        .dark .bento-tag { color: var(--gold); border-color: rgba(184,146,42,.25); }

        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; overflow: hidden; border-radius: 12px; box-shadow: 0 2px 40px rgba(0,0,0,.06); border: 1px solid var(--border); }
        .about-img { position: relative; overflow: hidden; min-height: 560px; }
        .about-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 6s ease; }
        .about-img:hover img { transform: scale(1.04); }
        .about-img-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,61,145,.7) 0%, transparent 50%); }
        .about-img-badge { position: absolute; bottom: 2rem; left: 2rem; background: rgba(255,255,255,.1); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 1rem 1.25rem; }
        .about-img-badge p { font-size: .78rem; color: rgba(255,255,255,.6); margin-bottom: .2rem; }
        .about-img-badge strong { color: var(--white); font-size: .95rem; font-weight: 500; }
        .about-content { padding: 4.5rem 4rem; background: var(--white); display: flex; flex-direction: column; justify-content: center; }
        .about-list { margin-top: 2.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
        .about-item { display: flex; align-items: flex-start; gap: 1rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
        .about-item:last-child { border-bottom: none; padding-bottom: 0; }
        .about-item-n { font-family: var(--f-display); font-size: 1.1rem; font-weight: 300; color: var(--gold); flex-shrink: 0; width: 24px; margin-top: .1rem; }
        .about-item-text h4 { font-size: .9rem; font-weight: 600; margin-bottom: .25rem; letter-spacing: .01em; }
        .about-item-text p { font-size: .85rem; color: var(--muted); line-height: 1.7; }

        .svc-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 4rem; }
        .svc-col { border-right: 1px solid var(--border); }
        .svc-col:last-child { border-right: none; }
        .svc-col-head { padding: 1.75rem 2rem; border-bottom: 1px solid var(--border); background: var(--off); }
        .svc-col-head h3 { font-family: var(--f-display); font-size: 1.1rem; font-weight: 400; letter-spacing: -.01em; color: var(--ink); }
        .svc-item { display: flex; align-items: flex-start; gap: 1rem; padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); transition: background .2s; }
        .svc-item:last-child { border-bottom: none; }
        .svc-item:hover { background: var(--off); }
        .svc-ico { font-size: 1.1rem; flex-shrink: 0; margin-top: .15rem; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: rgba(11,61,145,.06); border-radius: 6px; }
        .svc-item h4 { font-size: .9rem; font-weight: 500; margin-bottom: .2rem; }
        .svc-item p { font-size: .8rem; color: var(--muted); line-height: 1.6; }

        .stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.08); }
        .stat-cell { padding: 4rem 3rem; border-right: 1px solid rgba(255,255,255,.08); text-align: center; }
        .stat-cell:last-child { border-right: none; }
        .stat-big { font-family: var(--f-display); font-size: 3.5rem; font-weight: 300; color: var(--white); line-height: 1; margin-bottom: .5rem; }
        .stat-big em { font-style: normal; color: var(--gold); }
        .stat-desc { font-size: .8rem; font-weight: 400; color: rgba(255,255,255,.45); letter-spacing: .08em; text-transform: uppercase; }

        .tech-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 4rem; }
        .tech-item { background: var(--white); padding: 1.6rem 1rem; text-align: center; transition: background .2s; font-size: .82rem; font-weight: 400; color: var(--muted); letter-spacing: .03em; }
        .tech-item:hover { background: var(--off); color: var(--blue); }
        .tech-item span { font-size: 1.4rem; display: block; margin-bottom: .4rem; }

        .testi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-top: 4rem; }
        .testi-card { border: 1px solid var(--border); border-radius: 10px; padding: 2.25rem; background: var(--white); display: flex; flex-direction: column; gap: 1.25rem; transition: box-shadow .3s, transform .3s; }
        .testi-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,.06); transform: translateY(-3px); }
        .testi-quote { font-family: var(--f-display); font-size: 3.5rem; font-weight: 300; color: var(--gold); line-height: .8; }
        .testi-text { font-size: .95rem; font-weight: 300; color: var(--muted); line-height: 1.8; font-style: italic; }
        .testi-author { font-size: .82rem; font-weight: 600; color: var(--ink); letter-spacing: .04em; text-transform: uppercase; }

        .faq-list { max-width: 760px; margin: 4rem auto 0; }
        .faq-item { border-bottom: 1px solid var(--border); }
        .faq-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 1.6rem 0; font-size: 1rem; font-weight: 400; color: var(--ink); text-align: left; gap: 1rem; transition: color .2s; }
        .faq-btn:hover { color: var(--blue); }
        .faq-plus { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; transition: all .3s; color: var(--muted); }
        .faq-item.open .faq-plus { background: var(--blue); border-color: var(--blue); color: white; transform: rotate(45deg); }
        .faq-body { max-height: 0; overflow: hidden; font-size: .9rem; color: var(--muted); line-height: 1.8; transition: max-height .4s var(--ease), padding .4s; font-weight: 300; }
        .faq-item.open .faq-body { max-height: 200px; padding-bottom: 1.5rem; }

        .contact-wrap { display: grid; grid-template-columns: 1fr 1.4fr; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 32px rgba(0,0,0,.05); }
        .contact-left { background: var(--ink); padding: 4rem 3.5rem; display: flex; flex-direction: column; gap: 2rem; }
        .contact-left h3 { font-family: var(--f-display); font-size: 2rem; font-weight: 300; color: var(--white); line-height: 1.2; }
        .contact-left h3 em { font-style: italic; color: var(--gold); }
        .contact-details { display: flex; flex-direction: column; gap: 1rem; margin-top: auto; }
        .contact-row { display: flex; align-items: center; gap: .85rem; }
        .contact-ico { width: 36px; height: 36px; background: rgba(255,255,255,.07); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: .9rem; }
        .contact-row p { font-size: .82rem; color: rgba(255,255,255,.45); margin-bottom: .15rem; }
        .contact-row strong { color: var(--white); font-size: .9rem; font-weight: 400; }
        .contact-right { background: var(--white); padding: 4rem 3.5rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: .72rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: .8rem 1rem; border: 1px solid var(--border); border-radius: 4px; font-family: var(--f-body); font-size: .9rem; color: var(--ink); background: var(--off); outline: none; transition: border-color .2s, background .2s; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--blue); background: var(--white); }
        .form-group input::placeholder, .form-group textarea::placeholder { color: #B0B8C5; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .form-submit { width: 100%; padding: .95rem; background: var(--blue); color: var(--white); font-family: var(--f-body); font-size: .95rem; font-weight: 500; letter-spacing: .04em; border-radius: 4px; transition: background .2s, transform .2s; }
        .form-submit:hover { background: var(--blue-2); transform: translateY(-1px); }
        .form-msg { text-align: center; margin-top: 1rem; font-size: .85rem; color: var(--blue); display: none; }

        .nsic-strip { background: var(--off); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 3rem 4rem; }
        .nsic-inner { display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; }
        .nsic-label { font-size: .72rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
        .nsic-items { display: flex; flex-wrap: wrap; gap: .5rem; }
        .nsic-chip { font-size: .75rem; font-weight: 400; color: var(--muted); padding: .3rem .8rem; background: var(--white); border: 1px solid var(--border); border-radius: 100px; transition: all .2s; letter-spacing: .02em; }
        .nsic-chip:hover { border-color: var(--blue); color: var(--blue); }
        .nsic-chip strong { color: var(--ink); font-weight: 500; }

        .footer { background: var(--ink); color: rgba(255,255,255,.5); padding: 5rem 4rem 2.5rem; }
        .footer-top { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 4rem; padding-bottom: 4rem; border-bottom: 1px solid rgba(255,255,255,.07); margin-bottom: 2rem; }
        .footer-brand p { font-size: .875rem; color: rgba(255,255,255,.4); line-height: 1.8; max-width: 280px; margin-top: 1.25rem; font-weight: 300; }
        .footer-brand .f-logo { font-family: var(--f-display); font-size: 1.5rem; font-weight: 400; color: var(--white); display: flex; align-items: center; gap: 10px; }
        .footer-col h5 { font-size: .7rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.35); margin-bottom: 1.25rem; }
        .footer-col a { display: block; font-size: .875rem; color: rgba(255,255,255,.45); margin-bottom: .65rem; transition: color .2s; font-weight: 300; }
        .footer-col a:hover { color: var(--white); }
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .footer-bottom p { font-size: .8rem; color: rgba(255,255,255,.3); }
        .footer-tags { display: flex; gap: .75rem; flex-wrap: wrap; }
        .f-tag { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); padding: .3rem .7rem; border: 1px solid rgba(184,146,42,.25); border-radius: 100px; }
